name: Secret guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event source and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /.github/workflows/security-secrets.yml
            /tools/scan_commit_secrets.py
            /tools/test_commit_secret_merge.py
            /tests/test_commit_secret_guard.py
          sparse-checkout-cone-mode: false
      - name: Install checksum-pinned local scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paltrin-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/paltrin-gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/paltrin-gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/paltrin-gitleaks.tar.gz" -C "$RUNNER_TEMP/paltrin-gitleaks" gitleaks
      - name: Scan introduced commits with redaction and no repository suppressions
        shell: bash
        env:
          GUARD_CONTENTS_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          encoded_auth="$(printf 'x-access-token:%s' "$GUARD_CONTENTS_TOKEN" | base64 -w 0)"
          echo "::add-mask::$encoded_auth"
          unset GUARD_CONTENTS_TOKEN
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $encoded_auth"
          unset encoded_auth
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected full lowercase base and head commit IDs" >&2
            exit 2
          fi
          case "$SCAN_EVENT" in
            push|pull_request) ;;
            *) echo "Unsupported scan event" >&2; exit 2 ;;
          esac
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          scan_base="$BASE_SHA"
          if [[ "$SCAN_EVENT" == "pull_request" ]]; then
            scan_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          [[ "$scan_base" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$scan_base" "$HEAD_SHA"
          # Gitleaks can report success after Git cannot read a promised blob.
          # Prove the same introduced patch range is readable before scanning.
          git log --format= --patch --diff-merges=first-parent --no-ext-diff --no-textconv --no-color \
            "$scan_base..$HEAD_SHA" > /dev/null
          python3 tools/scan_commit_secrets.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --event "$SCAN_EVENT" \
            --tool "$RUNNER_TEMP/paltrin-gitleaks/gitleaks"
      - name: Prove synthetic trigger, legitimate range and suppression rejection
        env:
          PALTRIN_TEST_GITLEAKS: ${{ runner.temp }}/paltrin-gitleaks/gitleaks
        run: |
          python3 tests/test_commit_secret_guard.py
          python3 tools/test_commit_secret_merge.py

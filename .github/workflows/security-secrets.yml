name: Secret guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event source and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned local scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paltrin-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/paltrin-gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/paltrin-gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/paltrin-gitleaks.tar.gz" -C "$RUNNER_TEMP/paltrin-gitleaks" gitleaks
      - name: Scan introduced commits with redaction and no repository suppressions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/scan_commit_secrets.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --event "$SCAN_EVENT"
          --tool "$RUNNER_TEMP/paltrin-gitleaks/gitleaks"
      - name: Prove synthetic trigger, legitimate range and suppression rejection
        env:
          PALTRIN_TEST_GITLEAKS: ${{ runner.temp }}/paltrin-gitleaks/gitleaks
        run: python3 tests/test_commit_secret_guard.py
